# Discord bot — joins the dinkboard Docker network and uses shared Postgres.
# From /opt/apps/discordbot on the VPS:
#   docker compose -f docker-compose.prod.yml up --build -d
#
# Required in .env (never commit):
#   LAVALINK_PASSWORD=...

services:
  lavalink:
    container_name: discord-lavalink
    # 4.2.2 bundles lavaplayer 2.2.6, which Soundy v1.1.0 decodes fMP4 with.
    image: ghcr.io/lavalink-devs/lavalink:4.2.2
    restart: unless-stopped
    environment:
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD}
    volumes:
      - ./deploy/lavalink/application.yml:/opt/Lavalink/application.yml:ro
    networks:
      - dinkboard

  discord-bot:
    container_name: discord-bot
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - lavalink
    # minecraft_data is owned by 1000:1000 (mode 750 at the volume root). The image
    # runs as botuser (uid 10001); join gid 1000 so group r-x can read the mount.
    group_add:
      - "1000"
    env_file:
      - .env
    environment:
      SQL_HOST: postgres
      SQL_PORT: "5432"
      LAVALINK_URI: http://lavalink:2333
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD}
      # itzg minecraft-server data volume, read-only. Logs live in /minecraft/logs.
      MINECRAFT_DATA_DIR: /minecraft
    volumes:
      - minecraft_data:/minecraft:ro
      - /opt/apps/minecraft/recap-screenshots:/recap-screenshots:ro
    networks:
      - dinkboard

networks:
  dinkboard:
    external: true
    name: dinkboard_dinkboard

volumes:
  minecraft_data:
    external: true
    name: minecraft_data
