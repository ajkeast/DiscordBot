server:
  port: 2333
  address: 0.0.0.0

lavalink:
  server:
    # Set LAVALINK_PASSWORD in the VPS .env (shared with the bot).
    password: "${LAVALINK_PASSWORD}"
    sources:
      # YouTube disabled — datacenter IPs are blocked even with OAuth.
      youtube: false
      bandcamp: true
      # Built-in SoundCloud still requests progressive MP3 and HLS MP3.
      # SoundCloud removed those. The stream URL 404s. Playback is the
      # Soundy plugin below, which uses AAC HLS (fragmented MP4, audio/mp4).
      soundcloud: false
      twitch: true
      vimeo: true
      http: false
      local: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    playerUpdateInterval: 5
    soundcloudSearchEnabled: true
    # Only applies to the built-in source, which is off. Soundy drops Go+
    # tracks whose policy is SNIPPED (~30s previews).
    soundcloudFilterOutPreviewTracks: true
    gc-warnings: true
  plugins:
    # https://github.com/Lochis/soundy tag v1.1.0 — AAC HLS / fMP4 SoundCloud.
    # Built against lavaplayer 2.2.6, which Lavalink 4.2.2 bundles.
    - dependency: "com.github.Lochis.soundy:plugin:v1.1.0"
      repository: "https://jitpack.io"
      snapshot: false

metrics:
  prometheus:
    enabled: false

sentry:
  dsn: ""

plugins:
  soundy:
    enabled: true

logging:
  file:
    path: ./logs/
  level:
    root: INFO
    lavalink: INFO
  request:
    enabled: true
    includeClientInfo: true
    includeHeaders: false
    includeQueryString: true
    includePayload: true
    maxPayloadLength: 10000
