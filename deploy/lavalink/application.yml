server:
  port: 2333
  address: 0.0.0.0

lavalink:
  server:
    # Set LAVALINK_PASSWORD in the VPS .env (shared with the bot).
    password: "${LAVALINK_PASSWORD}"
    sources:
      # YouTube disabled — datacenter IPs are blocked even with OAuth.
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: false
      local: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    playerUpdateInterval: 5
    soundcloudSearchEnabled: true
    # Keep Go+ previews in search so we can fall back when a "full" stream 404s.
    soundcloudFilterOutPreviewTracks: false
    gc-warnings: true

metrics:
  prometheus:
    enabled: false

sentry:
  dsn: ""

logging:
  file:
    path: ./logs/
  level:
    root: INFO
    lavalink: INFO
  request:
    enabled: true
    includeClientInfo: true
    includeHeaders: false
    includeQueryString: true
    includePayload: true
    maxPayloadLength: 10000
